name: PR title

# Squash merge turns the PR title into the commit on main, so the title must be a Conventional Commit.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  conventional-commit:
    runs-on: ubuntu-latest
    steps:
      # The title comes in through env, never through ${{ }} inside the script:
      # a title is user input, and interpolating it would let it run as shell code.
      - name: Check that the title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|refactor|test|docs|chore|ci|build|perf|style|revert)(\([a-z0-9-]+\))?!?: [^ ].*$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "OK: $PR_TITLE"
          else
            echo "::error::PR title is not a Conventional Commit: \"$PR_TITLE\""
            echo "Expected: <type>(<optional scope>): <description>, e.g. \"feat(rules): add ability modifiers\""
            echo "Allowed types: feat, fix, refactor, test, docs, chore, ci, build, perf, style, revert"
            exit 1
          fi
